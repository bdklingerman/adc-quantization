[project]
name = "adc-quantization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bdklingerman", email = "bdklingerman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
